name: Changelog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-changelog:
    name: Verify changelog
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify every commit updates the changelog
        shell: pwsh
        env:
          BASE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ./tools/Test-Changelog.ps1 `
            -BaseRevision $env:BASE_REVISION `
            -HeadRevision $env:HEAD_REVISION `
            -DefaultBranch $env:DEFAULT_BRANCH
